<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta
      name="description"
      content="Compare dois investimentos e acompanhe seus rendimentos com juros compostos, mês a mês."
    >
    <meta name="theme-color" content="#007D69">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <title>Investe • Simulador de Investimentos</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f4f7f7;
      }

      #carregando {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, sans-serif;
        color: #142c35;
      }

      #carregando strong {
        font-size: 30px;
        letter-spacing: -1px;
      }

      #carregando span {
        font-size: 14px;
        color: #62757c;
      }

      #carregando svg {
        background: #007d69;
        border-radius: 20px;
        padding: 18px;
      }
    </style>
  </head>
  <body>
    <div id="carregando" role="status">
      <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
        <path
          d="M5 30L17 18L24 25L37 10M25 10H37V22"
          fill="none"
          stroke="white"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <strong>investe</strong>
      <span>Preparando seu simulador…</span>
    </div>
    <noscript>Ative o JavaScript no navegador para abrir o aplicativo.</noscript>
    <script>
      window.addEventListener('flutter-first-frame', function () {
        document.getElementById('carregando')?.remove();
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
